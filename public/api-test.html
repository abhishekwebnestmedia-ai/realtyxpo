<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Integration Test</h1>
    <button onclick="testAPI()">Test Projects API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing API...</p>';
            
            try {
                // Get token from localStorage (if available)
                const token = localStorage.getItem('token');
                console.log('Token from localStorage:', token ? 'Found' : 'Not found');
                
                if (!token) {
                    resultDiv.innerHTML = '<p style="color: red;">❌ No authentication token found in localStorage</p>';
                    return;
                }
                
                // Test the projects API
                const response = await fetch('https://backend.realtyxpo.in/api/projects', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('API Response Status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('API Response Data:', data);
                
                resultDiv.innerHTML = `
                    <h3>✅ API Success!</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Projects Found:</strong> ${Array.isArray(data) ? data.length : 'Unknown'}</p>
                    <p><strong>First Project Category:</strong> ${data[0]?.category || 'N/A'}</p>
                    <p><strong>First City:</strong> ${data[0]?.cities?.[0]?.cityName || 'N/A'}</p>
                    <details>
                        <summary>Full Response</summary>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </details>
                `;
                
            } catch (error) {
                console.error('API Error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ API Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check console for more details</p>
                `;
            }
        }
        
        // Auto-run test when page loads
        window.addEventListener('load', () => {
            console.log('🔍 Checking if token exists...');
            const token = localStorage.getItem('token');
            if (token) {
                console.log('Token found, testing API...');
                testAPI();
            } else {
                document.getElementById('result').innerHTML = '<p style="color: orange;">⚠️ Please login first to get authentication token</p>';
            }
        });
    </script>
</body>
</html>
